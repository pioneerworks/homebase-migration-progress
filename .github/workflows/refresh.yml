name: Refresh Linear snapshot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-linear-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh cached Linear data
        env:
          REFRESH_URL: ${{ secrets.DASHBOARD_REFRESH_URL }}
          REFRESH_SECRET: ${{ secrets.DASHBOARD_REFRESH_SECRET }}
        run: |
          test -n "$REFRESH_URL"
          test -n "$REFRESH_SECRET"
          curl --fail-with-body \
            --retry 2 \
            --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $REFRESH_SECRET" \
            "$REFRESH_URL"
